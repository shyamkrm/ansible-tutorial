---

- hosts: all
  become: true
  tasks:
  
  - name: Disable and stop httpd and php-fpm serivces on machines
    ansible.builtin.service:
      name: "{{ item }}"
      enabled: false
      state: stopped
    loop:
      - httpd
      - php-fpm


  - name: Remove the httpd package
    ansible.builtin.dnf:
      name: 
        - "{{ apache_package }}"
        - "{{ php_package }}"
      state: absent
      autoremove: true
