---

- hosts: all
  become: true
  tasks:
  
  - name: Refresh the repolist
    ansible.builtin.dnf:
      update_cache: true

  - name: Install the httpd package
    ansible.builtin.dnf:
      name: httpd
      state: present

  - name: Start httpd service, if not started
    ansible.builtin.service:
      name: httpd
      state: started

  - name: Enable httpd serivce on every reboot
    ansible.builtin.service:
      name: httpd
      enabled: yes
