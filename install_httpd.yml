---

- hosts: all
  become: true
  tasks:
  
  - name: Install the httpd package
    package:
      name:
        -  "{{ apache_package }}"
        -  "{{ php_package }}"
      state: present
      update_cache: true

  - name: Start and enable apache and php services, if not started
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - httpd
      - php-fpm
