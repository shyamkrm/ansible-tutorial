---
- hosts: all
  become: true
  tasks:

  - name: Refresh repo list
    tags: always
    ansible.builtin.dnf:
      update_cache: true


- hosts: web_servers
  become: true
  tasks:
  
  - name: Install the httpd package
    tags: linux,apache,httpd
    package:
      name:
        -  httpd
        -  php
      state: present

  - name: Start and enable apache and php services, if not started
    tags: linux,apache,httpd
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - httpd
      - php-fpm

- hosts: db_servers
  become: true
  tasks:

  - name: Install mariadb on rocky linux
    tags: linux,rocky,db,mariadb
    ansible.builtin.dnf:
      name: mariadb
      state: latest
    when: ansible_distribution == "Rocky"

  - name: Start and enable Mariadb services, if not started
    tags: linux,rocky,db,mariadb
    ansible.builtin.service:
      name: mariadb
      state: started
      enabled: yes
    when: ansible_distribution == "Rocky"


- hosts: file_servers
  become: true
  tasks:

  - name: Install samba package on RHEL
    tags: linux,rhel,samba
    ansible.builtin.dnf:
      name: samba
      state: latest
    when: ansible_distribution == "RedHat"
    




   
