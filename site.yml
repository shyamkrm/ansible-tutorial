---
- hosts: all
  become: true
  pre_tasks:

  - name: Refresh repo list
    tags: always
    ansible.builtin.dnf:
      update_cache: true
    when: ansible_distribution in ['RedHat', 'Rocky']

- hosts: all
  become: true
  roles:
    - base

- hosts: web_servers
  become: true
  roles:
    - web_servers

- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: file_servers
  become: true
  roles:
    - file_servers
