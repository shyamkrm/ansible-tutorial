- name: Install the httpd package
  tags: linux,apache,httpd
  package:
    name:
      -  httpd
      -  php
    state: present
- name: copy the site files to webservers
  tags: linux,apache,httpd
  copy:
    src: default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: 0644

- name: Start and enable apache and php services, if not started
  tags: linux,apache,httpd
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - httpd
    - php-fpm

- name: update the owneremail for the httpd conf file
  tags: linux,apache,httpd
  lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: "^ServerAdmin"
    line: ServerAdmin someone@somewhere.in
  notify: restart_apache
